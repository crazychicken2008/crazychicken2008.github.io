<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY CHICKEN 2008 | OFFICIAL HUB</title>
    <style>
        :root {
            --main-gold: #ffcc00;
            --yt-red: #ff0000;
            --tt-cyan: #00f2ea;
            --tt-pink: #ff0050;
            --line-green: #06c755;
            --discord-blurple: #5865f2;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景のスキャンライン演出 */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: var(--main-gold);
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            margin-bottom: 5px;
        }

        .id-tag {
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* リンクボタンのスタイル */
        .link-card {
            display: block;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            font-weight: bold;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
        }

        /* 各ボタンの個別色設定 */
        .youtube:hover { border-color: var(--yt-red); color: var(--yt-red); box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .tiktok:hover { border-color: var(--tt-cyan); color: var(--tt-cyan); box-shadow: 0 0 15px rgba(0, 242, 234, 0.3); }
        .line:hover { border-color: var(--line-green); color: var(--line-green); box-shadow: 0 0 15px rgba(6, 199, 85, 0.3); }
        .discord:hover { border-color: var(--discord-blurple); color: var(--discord-blurple); box-shadow: 0 0 15px rgba(88, 101, 242, 0.3); }

        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
        }

        .glitch-text { animation: glitch 3s infinite; }
        @keyframes glitch {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="id-tag">PROJECT 2008 / OFFICIAL</div>

        <a href="http://www.youtube.com/@crazy_chicken" class="link-card youtube" target="_blank">

        </a>

        <div class="footer">

    </div>

</body>
</html>
