<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YCRA INTERNAL // CONFIDENTIAL</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }

        /* 第1形態：白い画面（偽装） */
        #intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; color: black;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .btn-access {
            margin-top: 30px; padding: 15px 40px; font-size: 1.2rem;
            background: #eee; border: 2px solid #000; cursor: pointer; font-weight: bold;
        }
        .btn-access:hover { background: #ddd; }

        /* 第2形態：ハッカートラップ（隠し） */
        #trap {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #0f0; z-index: 500;
        }

        /* 動く背景文字 */
        .scrolling-text {
            position: absolute; white-space: nowrap; font-size: 2rem;
            font-weight: bold; font-family: monospace; opacity: 0.3;
            animation: scroll-left 5s linear infinite;
        }

        @keyframes scroll-left {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        .warning-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); border: 5px solid #f00; color: #f00;
            padding: 40px; text-align: center; z-index: 1000;
            box-shadow: 0 0 50px #f00; animation: flash 0.5s infinite;
        }

        @keyframes flash {
            0% { opacity: 1; border-color: #f00; }
            50% { opacity: 0.8; border-color: #500; }
            100% { opacity: 1; border-color: #f00; }
        }
    </style>
</head>
<body>

    <div id="intro">
        <h2 style="letter-spacing: 5px;">YCRA 機密情報</h2>
        <p>このサイトは YCRA 第一階層以上のみのアクセスが許可されています。</p>
        <button class="btn-access" onclick="launchTrap()">[ アクセスを承認する ]</button>
    </div>

    <div id="trap">
        <div id="bg-container"></div>
        <div class="warning-box">
            <h1 style="font-size: 4rem; margin: 0;">ACCESS DENIED</h1>
            <p style="color: #fff; font-size: 1.5rem;">IP LOGGED. AUTHORITIES NOTIFIED.</p>
            <div style="font-size: 5rem; margin-top: 20px; font-family: 'Arial Black'; color: #0f0;">JOIN YCRA</div>
        </div>
    </div>

    <script>
        function launchTrap() {
            // 画面切り替え
            document.getElementById('intro').style.display = 'none';
            document.getElementById('trap').style.display = 'block';

            // サイレン音の生成（ブラウザ機能で鳴らします）
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; // 鋭い音
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }, 600);

            // 背景文字の生成
            const container = document.getElementById('bg-container');
            for (let i = 0; i < 30; i++) {
                const div = document.createElement('div');
                div.className = 'scrolling-text';
                div.style.top = (i * 4) + '%';
                div.style.animationDuration = (Math.random() * 3 + 2) + 's';
                div.innerText = "JOIN YCRA ".repeat(20);
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>
